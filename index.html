function scoreNum(v, cls) { return `<span class="num ${cls||''}">${fmt(v)}</span>`; }
function pillarOf(id) { return PILLARS.find(p => p.id === id); }
function statusLabel(d, rv) {

}

function vDD() {

    return `<button class="ddt ${x.id === t.id ? 'on' : ''}" data-a="ddtheme" data-t="${x.id}"><span>${x.name}${spark(r.themes[x.id].score)}</span><em class="${done === tq.length ? 'full' : ''}">${done}/${tq.length}</em></button>`; }).join('')}</div>`).join('');
  const idx = THEMES.findIndex(x => x.id === t.id);
  return head('Due diligence ESG', 'Responde con la mayor honestidad posible y agrega evidencia (enlace a SharePoint/Drive o nombre del documento). Una respuesta “Sí” sin evidencia vale 75%; validada por Aztlan vale 100%.', `<div class="mini-prog"><div style="width:${r.completion * 100}%"></div></div><span class="muted small">${Math.round(r.completion * 100)}% completo</span>`) + `

      ${qs.map((q, i) => qCard(q, i, d, rv, ro, isAdmin)).join('')}
      <div class="ddq-f">${idx > 0 ? `<button class="btn ghost" data-a="ddtheme" data-t="${THEMES[idx - 1].id}">← ${THEMES[idx - 1].name}</button>` : '<span></span>'}${idx < THEMES.length - 1 ? `<button class="btn" data-a="ddtheme" data-t="${THEMES[idx + 1].id}">${THEMES[idx + 1].name} →</button>` : `<button class="btn" data-a="go" data-v="score">Ver mi calificación →</button>`}</div>

function qCard(q, i, d, rv, ro, isAdmin) {
  const a = d.answers?.[q.id] || {};
  const val = rv.validations?.[q.id] || {};
  const s = qScore(q, a, val.s);
  const dis = ro ? 'disabled' : '';
  let ctl = '';
  if (q.k === 'yn') {
    const opts = [['si', 'Sí'], ['parcial', 'Parcial / en proceso'], ['no', 'No']]; if (q.na) opts.push(['na', 'No aplica']);

    ${guideBox(q, a)}
    ${ctl}
    <div class="qx">
      <input class="ev" data-ev="${q.id}" value="${esc(a.ev || '')}" placeholder="Evidencia: enlace o nombre del documento" ${dis}>
      <input class="ev" data-note="${q.id}" value="${esc(a.note || '')}" placeholder="Comentarios / responsable" ${dis}>
    </div>
    <div class="files">${fileChips(q.id, a, ro)}${!ro ? uploadCtl(q.id) : ''}</div>
    ${q.k !== 'num' ? `<label class="pubchk"><input type="checkbox" data-pub="${q.id}" ${a.pub ? 'checked' : ''} ${dis}> Se comunica públicamente (informe, sitio web o inversionistas)</label>` : ''}
    ${threadBox(q.id, d, rv)}
    ${isAdmin ? `<div class="val"><span>Validación de Aztlan:</span><button class="opt sm ${val.s === 'ok' ? 'on si' : ''}" data-a="val" data-q="${q.id}" data-v="ok">✓ Evidencia válida</button><button class="opt sm ${val.s === 'rej' ? 'on no' : ''}" data-a="val" data-q="${q.id}" data-v="rej">✗ Insuficiente</button><button class="opt sm" data-a="val" data-q="${q.id}" data-v="">Limpiar</button><input class="ev" data-valc="${q.id}" value="${esc(val.c || '')}" placeholder="Comentario para el cliente"></div>`
      : (val.s ? `<div class="valc ${val.s}">${val.s === 'ok' ? '✓ Validado por Aztlan' : '✗ Aztlan marcó la evidencia como insuficiente'}${val.c ? ': ' + esc(val.c) : ''}</div>` : '')}

}

// ---------- NORMATIVO
function vNormativo() {
  const d = curData(), rv = curReview();
  const listed = d.profile?.listed === 'si';
  const rows = REGS.map(reg => {
    const st = reg.q.map(id => { const a = d.answers?.[id]; const q = QM[id]; if (!a || a.v === undefined || a.v === '') return 'sin'; if (a.v === 'na') return 'na'; const s = qScore(q, a, rv.validations?.[id]?.s); return s >= 0.75 ? 'ok' : s > 0 ? 'parcial' : 'brecha'; });
    let status = st.includes('brecha') ? 'brecha' : st.includes('parcial') ? 'parcial' : st.includes('sin') ? 'sin' : st.every(x => x === 'na') ? 'na' : 'ok';
    if (reg.listed && !listed) status = 'na';
    return { reg, status };
  });
  const L = { ok: ['Cumple', '#5BAE7E'], parcial: ['Parcial', '#F08C2E'], brecha: ['Brecha', '#E5484D'], sin: ['Sin respuesta', '#8E8BB3'], na: ['No aplica', '#55606a'] };
  const cnt = k => rows.filter(x => x.status === k).length;
  return head('Cumplimiento normativo en México', 'Semáforo de las obligaciones legales mexicanas vinculadas a tus respuestas. No sustituye una auditoría legal; sirve para priorizar.') + `
  <section class="kpis">${['ok', 'parcial', 'brecha', 'sin'].map(k => `<div class="kpi"><label>${L[k][0]}</label><b style="color:${L[k][1]}">${cnt(k)}</b></div>`).join('')}</section>
  <div class="card"><table class="tbl"><thead><tr><th>Regulación</th><th>Área</th><th>A quién aplica</th><th>Estatus</th></tr></thead><tbody>
  ${rows.map(({ reg, status }) => `<tr><td><b>${esc(reg.name)}</b></td><td>${reg.area}</td><td class="muted">${esc(reg.scope)}</td><td><span class="chip sm" style="--c:${L[status][1]}"><i></i>${L[status][0]}</span></td></tr>`).join('')}
  </tbody></table></div>
  <div class="card"><h3>Calendario CNBV para emisoras (IFRS S1/S2)</h3>
    <div class="cal"><div class="cal-i done"><label>Ejercicio 2025 · entregado en 2026</label><b>Ya obligatorio</b><p>Primer informe. Podía limitarse a clima (S2), sin cifras comparativas ni alcance 3. Sin aseguramiento externo.</p></div>
    <div class="cal-i now"><label>Ejercicio 2026 · se entrega en 2027</label><b>En curso</b><p>Informe completo: todos los temas (S1), clima (S2) y alcance 3. Aseguramiento limitado.</p></div>
    <div class="cal-i"><label>Ejercicio 2027+ · se entrega en 2028+</label><b>Próximo</b><p>Mismo alcance con aseguramiento razonable por auditor externo.</p></div></div>
    <p class="muted small">Plazo: a más tardar el 3er día hábil después de la asamblea anual que aprueba resultados, vía BMV/BIVA y STIV-2. Empresas privadas: sin obligación legal, pero bancos, inversionistas y clientes globales piden datos ESG; pueden usar las NIS A-1 y B-1 del CINIF. Fuente: DOF 28-ene-2025 (CNBV).</p>
    ${curData().profile?.listed === 'si' ? '<div class="note">Tu empresa está marcada como emisora: el informe IFRS S1/S2 es obligatorio.</div>' : ''}
  </div>
  <div class="card"><h3>Calificadoras ESG e inversionistas</h3><p class="muted small">No existe una metodología única: cada calificadora pondera distinto y la información pública manda.</p>
    <table class="tbl"><thead><tr><th>Calificadora</th><th>Fuente de información</th><th>Participación de la empresa</th></tr></thead><tbody>${RATERS.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h3>Marcos de reporte y mejores prácticas que usa la plataforma</h3><div class="fw">${FRAMEWORKS.map(([n, t]) => `<div><b>${n}</b><p>${t}</p></div>`).join('')}</div></div>`;
}

// ---------- 10 MEJORES PRÁCTICAS
function practiceStatus(d, rv, ids) {
  const qs = ids.map(id => QM[id]).filter(q => q && applies(q, d.profile));
  const sc = qs.map(q => qScore(q, d.answers?.[q.id], rv.validations?.[q.id]?.s)).filter(s => s != null);
  if (!sc.length) return { v: null, k: 'na' };
  const v = sc.reduce((x, y) => x + y, 0) / sc.length;
  return { v, k: v >= 0.75 ? 'ok' : v > 0.2 ? 'mid' : 'bad' };
}
function practicesCard(d, rv) {
  const ps = PRACTICES.map(p => ({ p, st: practiceStatus(d, rv, p.q) }));
  const ok = ps.filter(x => x.st.k === 'ok').length;
  return `<div class="card"><div class="ch"><h3>Las 10 mejores prácticas ESG 2026</h3><span class="muted small">${ok} de 10 implementadas</span></div>
  <div class="prac">${ps.map(({ p, st }) => `<div class="pr ${st.k}" ${tip(p.desc + (st.v != null ? ' · cumplimiento ' + Math.round(st.v * 100) + '%' : ''))}><span class="pn">${p.n}</span><b>${p.name}</b><span class="sem s-${st.k}"></span><span class="pv2">${st.v == null ? 'N/A' : Math.round(st.v * 100) + '%'}</span></div>`).join('')}</div></div>`;
}

// ---------- DISEÑO TRIPARTITA
function triCard(d, rv) {
  const cols = ['pol', 'proc', 'org', 'dato'].map(k => {
    const qs = Q.filter(q => q.tri === k && applies(q, d.profile));
    const items = qs.map(q => ({ q, s: qScore(q, d.answers?.[q.id], rv.validations?.[q.id]?.s) })).filter(x => x.s !== null);
    const ok = items.filter(x => x.s >= 0.75).length;
    const pct = items.length ? ok / items.length : 0;
    const top = items.filter(x => x.q.w > 1 || x.q.legal).slice(0, 7);
    return `<div class="tc"><div class="tc-h"><span class="tri" style="--c:${TRI[k].color}">${TRI[k].plural}</span><b>${ok}<small>/${items.length}</small></b></div>
      <div class="bar"><div style="width:${pct * 100}%;background:${TRI[k].color}"></div></div><p class="muted small">${TRI[k].desc}</p>
      <ul>${top.map(x => `<li data-a="gotheme" data-t="${x.q.t}" ${tip(x.q.q)}><span class="sem s-${x.s >= 0.75 ? 'ok' : x.s > 0.2 ? 'mid' : 'bad'}"></span>${esc(shortQ(x.q))}</li>`).join('')}</ul></div>`;
  }).join('');
  return `<div class="card"><div class="ch"><h3>Diseño tripartita del sistema</h3><span class="muted small">Cada criterio ESG cubierto por una política, un procedimiento y un órgano de gobierno</span></div><div class="tri4">${cols}</div></div>`;
}
function shortQ(q) { return q.q.replace(/^\(Emisoras\)\s*/, '').replace(/^¿/, '').replace(/^¿(Tiene|Cuenta con|Ha|Está|Existe|Realiza|Respeta|Presenta|Publica|Mide|Evalúa|Verifica|Aplica|Implementa|Responde|Prohíbe|Ofrece|Registra|Monitorea|Capacita)\s+(un |una |el |la |los |las |de |sus |su )?/i, '').replace(/\?$/, '').replace(/^./, c => c.toUpperCase()); }

// ---------- MATRIZ SEMÁFORO (Política · Adopción · Comunicación)
function semDims(q, a, val) {
  if (!a || a.v === undefined || a.v === '' || a.v === null) return null;
  if (a.v === 'na') return 'na';
  const pol = q.k === 'yn' ? (a.v === 'si' ? 'ok' : a.v === 'parcial' ? 'mid' : 'bad') : q.k === 'mat' ? (Number(a.v) >= 3 ? 'ok' : Number(a.v) >= 1 ? 'mid' : 'bad') : 'ok';
  const adop = pol === 'bad' ? 'bad' : val?.s === 'ok' ? 'ok' : val?.s === 'rej' ? 'bad' : hasEv(a) ? 'mid' : 'bad';
  const com = a.pub ? 'ok' : pol === 'bad' ? 'bad' : 'bad';
  return { pol, adop, com };
}

  const PR = ['Crítica', 'Alta', 'Media', 'Baja', 'Cumplido'];

  const PRH = { 'Crítica': 'obligaciones legales con brecha', 'Alta': 'temas de materialidad alta o criterios clave', 'Media': 'materialidad media', 'Baja': 'materialidad baja', 'Cumplido': 'política adoptada y con evidencia validada' };
  const groups = grp === 'prio' ? PR.map(p => ({ name: 'Prioridad ' + p.toLowerCase(), color: PRC[p], hint: PRH[p], f: x => x.prio === p })).map((g, i) => i === 4 ? { ...g, name: 'Cumplido' } : g)
    : PILLARS.map(p => ({ name: p.name, color: p.color, f: x => THEME[x.q.t].p === p.id }));
  const stRank = x => x.dims === null ? 1 : x.dims === 'na' ? 3 : x.dims.pol === 'bad' ? 0 : x.dims.adop !== 'ok' ? 1 : 2;
  const sortFn = (x, y) => (PR.indexOf(x.prio) - PR.indexOf(y.prio)) || (stRank(x) - stRank(y)) || (r.themes[y.q.t].mat - r.themes[x.q.t].mat);

  <section class="kpis"><div class="kpi"><label>Celdas en verde</label><b style="color:var(--jade)">${cnt('ok')}</b></div><div class="kpi"><label>Celdas en amarillo</label><b style="color:#F08C2E">${cnt('mid')}</b></div><div class="kpi"><label>Celdas en rojo</label><b style="color:var(--grana)">${cnt('bad')}</b></div><div class="kpi"><label>Criterios evaluados</label><b>${rows.length}</b></div></section>

function semPrio(q, dims, r) {
  if (dims === 'na') return 'Baja';
  if (dims && dims.pol === 'ok' && dims.adop === 'ok') return 'Cumplido';
  const m = r.themes[q.t].mat;
  if (q.legal) return 'Crítica';
  if (m >= 3 || q.w > 1) return 'Alta';
  return m === 2 ? 'Media' : 'Baja';
}
function semRow(x, grp) {

  const open = S.semOpen?.[q.id];
  const cells = dims === null ? `<td class="c" colspan="3"><span class="muted small">Sin responder</span></td>` : dims === 'na' ? `<td class="c" colspan="3"><span class="muted small">No aplica</span></td>` : `<td class="c">${dot(dims.pol)}</td><td class="c">${dot(dims.adop)}</td><td class="c">${dot(dims.com)}</td>`;
  const g = GUIDE[q.id];
  const p = pillarOf(THEME[q.t].p);
  return `<tr class="click semrow ${open ? 'open' : ''}" data-a="semrow" data-q="${q.id}"><td><span class="caret">▸</span>${esc(q.q)}</td><td>${triChip(q)}</td><td class="muted small">${grp === 'prio' ? `<span class="pdot" style="background:${p.color}"></span>` : ''}${esc(THEME[q.t].name)}</td>${cells}<td><span class="prio ${prio === 'Cumplido' ? 'Cumplido' : prio}">${prio}</span></td></tr>
  ${open && g ? `<tr class="guiderow"><td colspan="7"><div class="g-body g-in"><div class="g-need"><label>Qué debes cumplir</label><p>${esc(g.need)}</p></div><div class="g-steps"><label>Cómo hacerlo</label><ol>${g.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div><div class="g-ev"><label>Evidencia que lo demuestra</label><p>${esc(g.ev)}</p><p class="muted small">${esc(q.ref)}</p><button class="btn ghost sm" data-a="gotheme" data-t="${q.t}">Responder / subir evidencia →</button></div></div></td></tr>` : ''}`;
}

// ===================== COMUNICACIÓN AZTLAN ↔ CLIENTE =====================
function nowIso() { return new Date().toISOString(); }
function fmtWhen(iso) { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) + ' · ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }); }
function myRole() { return S.role === 'admin' ? 'admin' : 'client'; }
function thread(d, rv, qid) {
  return [...(d?.threads?.[qid] || []).map(m => ({ ...m, by: 'client' })), ...(rv?.threads?.[qid] || []).map(m => ({ ...m, by: 'admin' }))].sort((x, y) => (x.at || '').localeCompare(y.at || ''));
}
function threadKeys(d, rv) { return [...new Set([...Object.keys(d?.threads || {}), ...Object.keys(rv?.threads || {})])]; }
function unreadIn(d, rv, qid, role) {
  const seen = (role === 'admin' ? rv?.seen : d?.seen)?.[qid] || '';
  return thread(d, rv, qid).filter(m => m.by !== role && (m.at || '') > seen).length;
}
function pendClient(d, rv) {
  const vals = rv.validations || {};
  const rej = Object.entries(vals).filter(([q, v]) => v.s === 'rej' && QM[q] && !((d.answers?.[q]?.evAt || '') > (v.at || ''))).map(([q]) => q);

  const notes = rv.notes && (rv.notesAt || '') > (d.seen?._notes || '') ? 1 : 0;
  return { rej, msgs, reqs, notes, total: rej.length + msgs.length + reqs.length + notes };
}
function pendAdmin(d, rv) {
  const vals = rv.validations || {};
  const ev = Q.filter(q => applies(q, d.profile) && hasEv(d.answers?.[q.id]) && d.answers[q.id].v !== 'no' && (!vals[q.id]?.s || (d.answers[q.id].evAt || '') > (vals[q.id].at || ''))).map(q => q.id);
  const msgs = threadKeys(d, rv).filter(k => unreadIn(d, rv, k, 'admin'));

}

// ---------- METODOLOGÍA
function vMetodo() {

  <div class="card prose">
    <h3>1. Estructura</h3><p>La calificación se organiza en <b>3 pilares</b> (Ambiental, Social y Gobernanza) y <b>15 temas</b>, con ${Q.length} criterios conectados a la regulación mexicana y a los estándares y calificadoras que integra la metodología.</p>
    <h3>2. Puntaje por pregunta (0 a 1)</h3><table class="tbl"><tbody>
    <tr><td>Sí, con evidencia</td><td class="r">1.00</td></tr><tr><td>Sí, sin evidencia</td><td class="r">0.75</td></tr><tr><td>Parcial / en proceso</td><td class="r">0.40 (0.50 si Aztlan lo valida)</td></tr><tr><td>No / sin respuesta</td><td class="r">0</td></tr><tr><td>No aplica</td><td class="r">se excluye</td></tr>
    <tr><td>Evidencia marcada como insuficiente por Aztlan</td><td class="r">máx. 0.25</td></tr>
    <tr><td>Indicadores numéricos (IBSO)</td><td class="r">1.00 si se reporta; con meta de desempeño: 0.5 por reportar + 0.5 según desempeño</td></tr>
    <tr><td>Escala de madurez (0–4)</td><td class="r">nivel ÷ 4</td></tr></tbody></table>
    <h3>3. Puntaje por tema (0 a 5)</h3><p>Promedio ponderado de sus preguntas (las preguntas clave pesan el doble) multiplicado por 5.</p>
    <h3>4. Materialidad por sector</h3><p>Cada tema tiene materialidad <b>alta (3), media (2) o baja (1)</b> según el sector, definida por Aztlan a partir de los temas materiales por industria (SASB) y de los pesos sectoriales que usan las calificadoras. Las empresas emisoras en BMV/BIVA reciben materialidad alta en Consejo y Derechos de accionistas. El pilar y la calificación ESG son el promedio de los temas ponderado por materialidad.</p>
    <h3>5. Controversias y calificación combinada</h3><p>La puntuación de controversias parte de 5 y resta por cada incidente según su severidad (Bajo −0.25, Moderado −0.5, Importante −1, Alto −1.5, Severo −2.5; resueltas restan la mitad). Si es menor que la ESG, la <b>combinada</b> es el promedio de ambas, de modo que un incidente grave limita la calificación aunque las prácticas sean buenas.</p>
    <h3>6. Niveles</h3><table class="tbl"><tbody>${RATINGS.map((r, i) => `<tr><td>${badge(r, 1)}</td><td>${r.min.toFixed(1)} – ${(RATINGS[i + 1]?.min ?? 5).toFixed(1)}</td><td>${r.desc}</td></tr>`).join('')}</tbody></table>

      setUp(qid, m, true);

}
async function delFile(qid, i) {
  const d = curData(); const ans = d?.answers?.[qid]; if (!ans?.files?.[i]) return;
  const f = ans.files[i];
  d.answers[qid] = { ...ans, files: ans.files.filter((_, j) => j !== i) };
  markDirty(); keepScroll(render);
  if (f.id && S.assets) { try { await S.assets.delete(f.id); } catch (e) {} }
}

function scrollTop() { const m = document.getElementById('main'); if (m) m.scrollTop = 0; window.scrollTo(0, 0); }
function keepScroll(fn) { const m = document.getElementById('main'); const y = m ? m.scrollTop : 0; const wy = window.scrollY; fn(); const m2 = document.getElementById('main'); if (m2) m2.scrollTop = y; window.scrollTo(0, wy); }

// ===================== DESCARGAS =====================
async function save(filename, data) {
  if (!S.downloads) return;
  try { await S.downloads.save({ filename, data }); } catch (e) { setSave('Descarga cancelada'); }
}
function downloadPlan() {
  const d = curData(); const { items } = buildPlan(d, curReview()); const plan = d.plan || {};
  const rows = [['Fase', 'Plazo', 'Pilar', 'Tema', 'Tipo', 'Acción', 'Qué se pide', 'Pasos', 'Evidencia', 'Prioridad', 'Obligación legal', 'Impacto (pts)', 'Referencia', 'Responsable', 'Fecha', 'Estatus']];
  items.forEach(i => { const p = plan[i.id] || {}; const g = GUIDE[i.id] || {}; rows.push([i.phase, PHASES[i.phase].when, pillarOf(i.pillar).name, THEME[i.theme].name, TRI[i.q.tri].name, i.action, g.need || '', (g.steps || []).map((s, k) => (k + 1) + '. ' + s).join(' '), g.ev || '', i.priority, i.legal ? 'Sí' : 'No', i.uplift.toFixed(3), i.q.ref, p.owner || '', p.due || '', { curso: 'En curso', hecho: 'Terminada' }[p.status] || 'Pendiente']); });
  const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  save(`Plan_ESG_${(d.profile?.name || 'empresa').replace(/[^\w]+/g, '_')}.csv`, csv);
}

  const d = curData(), rv = curReview(); const r = compute(d, rv); const { items, proj } = buildPlan(d, rv);
  const rt = rating(r.combined);
  const html = `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Reporte ESG ${esc(d.profile?.name || '')}</title><style>body{font-family:Georgia,serif;max-width:900px;margin:40px auto;color:#14231c;line-height:1.45;padding:0 20px}h1{font-size:28px;margin:0}h2{border-bottom:2px solid #0f5c47;padding-bottom:4px;margin-top:32px}table{width:100%;border-collapse:collapse;font:13px system-ui,sans-serif}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left}th{background:#f2f1ea}.r{text-align:right}.big{font-size:56px;font-weight:700;color:#0b3d4a}.muted{color:#666}</style></head><body>
  <img src="${LOGO_EM}" alt="Aztlan" style="width:64px;height:64px"><p class="muted">Aztlan · Reporte de evaluación ESG · ${today()}</p><h1>${esc(d.profile?.name || '')}</h1><p>${esc(d.profile?.sector || '')} · RFC ${esc(d.profile?.rfc || '—')}</p>
  <div class="big">${fmt(r.combined)} <span style="font-size:20px">/5 · ${rt.name}</span></div><p>${rt.desc}</p>
  <h2>Calificación por pilar y tema</h2><table><tr><th>Pilar / tema</th><th>Materialidad</th><th class="r">Score</th><th>Nivel</th></tr>
  ${PILLARS.map(p => `<tr><th>${p.name}</th><th></th><th class="r">${fmt(r.pillars[p.id].score)}</th><th>${rating(r.pillars[p.id].score)?.name || ''}</th></tr>${THEMES.filter(t => t.p === p.id).map(t => `<tr><td>${t.name}</td><td>${['', 'Baja', 'Media', 'Alta'][r.themes[t.id].mat]}</td><td class="r">${fmt(r.themes[t.id].score)}</td><td>${rating(r.themes[t.id].score)?.name || ''}</td></tr>`).join('')}`).join('')}
  <tr><th>Controversias</th><th></th><th class="r">${fmt(r.contro)}</th><th></th></tr><tr><th>ESG</th><th></th><th class="r">${fmt(r.esg)}</th><th></th></tr><tr><th>ESG combinada</th><th></th><th class="r">${fmt(r.combined)}</th><th>${rt.name}</th></tr></table>
  <h2>Proyección</h2><p>${proj.map((v, i) => (i ? 'Fase ' + i : 'Hoy') + ': <b>' + fmt(v) + '</b> (' + rating(v).name + ')').join(' → ')}</p>
  <h2>Plan de trabajo</h2>${[1, 2, 3].map(ph => `<h3>${PHASES[ph].name} (${PHASES[ph].when})</h3><table><tr><th>Acción</th><th>Tema</th><th>Prioridad</th><th class="r">Impacto</th></tr>${items.filter(i => i.phase === ph).map(i => `<tr><td>${esc(i.action)}</td><td>${THEME[i.theme].name}</td><td>${i.priority}</td><td class="r">+${fmt(i.uplift, 2)}</td></tr>`).join('')}</table>`).join('')}
  ${rv.notes ? `<h2>Comentarios de Aztlan</h2><p>${esc(rv.notes).replace(/\n/g, '<br>')}</p>` : ''}
  <p class="muted" style="margin-top:40px">Metodología propietaria Aztlan · Sistema Integral de Cumplimiento Sustentable: escala 0–5, materialidad por sector, ajuste por controversias. Este reporte es una autoevaluación con revisión de Aztlan y no constituye una opinión legal.</p></body></html>`;
  save(`Reporte_ESG_${(d.profile?.name || 'empresa').replace(/[^\w]+/g, '_')}.html`, html);
}


// ===================== BACKEND: SharePoint vía Microsoft Graph =====================
// Estructura en la biblioteca de documentos del sitio:
//   Clientes/<empresa>/empresa.json            ← lo escribe el cliente (permiso de edición en su carpeta)
//   Clientes/<empresa>/evidencias/<criterio>/… ← archivos de evidencia (cualquier formato)
//   Revisiones/<empresa>/revision.json         ← lo escribe Aztlan (el cliente solo lectura)
//   Publico/benchmarks.json                    ← promedios anónimos por sector (clientes solo lectura)
const CFG = window.AZTLAN_CONFIG || {};
const SP = (() => {
  const GRAPH = 'https://graph.microsoft.com/v1.0';
  const SCOPES = ['User.Read', 'Files.ReadWrite.All', 'Sites.ReadWrite.All'];
  let msalApp = null, account = null, driveBase = '', driveId = '', pollTimer = null;
  const appUrl = () => (CFG.APP_URL || (location.origin + location.pathname)).replace(/\/?$/, '/');

  // ---------- autenticación
  async function token() {
    if (window.__TEST_TOKEN) return window.__TEST_TOKEN;
    try { return (await msalApp.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
    catch (e) { await msalApp.acquireTokenRedirect({ scopes: SCOPES, account }); throw e; }
  }
  async function g(path, opt = {}, tries = 0) {
    const t = await token();
    const url = path.startsWith('http') ? path : GRAPH + path;
    const headers = { Authorization: 'Bearer ' + t, ...(opt.headers || {}) };
    let body = opt.body;
    if (body && typeof body === 'object' && !(body instanceof Blob) && !(body instanceof ArrayBuffer)) { body = JSON.stringify(body); headers['Content-Type'] = 'application/json'; }
    const r = await fetch(url, { ...opt, headers, body, cache: 'no-store' });
    if (r.status === 404) return null;
    if ((r.status === 429 || r.status === 503 || r.status === 504) && tries < 4) {
      await new Promise(x => setTimeout(x, (+r.headers.get('Retry-After') || 2 ** tries) * 1000));
      return g(path, opt, tries + 1);
    }
    if (!r.ok) { const txt = await r.text().catch(() => ''); const err = new Error(`Microsoft Graph ${r.status}: ${txt.slice(0, 400)}`); err.status = r.status; throw err; }
    return r;
  }
  const enc = p => p.split('/').map(encodeURIComponent).join('/');
  const itemUrl = p => `${driveBase}/root:/${enc(p)}`;

  // ---------- archivos JSON
  async function getJSON(p) {
    let meta;
    try { meta = await g(itemUrl(p)); } catch (e) { if (e.status === 403 || e.status === 401) return null; throw e; }
    if (!meta) return null;
    const m = await meta.json();
    const dl = m['@microsoft.graph.downloadUrl'];
    const r = dl ? await fetch(dl, { cache: 'no-store' }) : await g(itemUrl(p) + ':/content');
    if (!r || !r.ok) return null;
    try { return JSON.parse(await r.text()); } catch (e) { return null; }
  }
  async function putJSON(p, obj) {
    const r = await g(itemUrl(p) + ':/content', { method: 'PUT', headers: { 'Content-Type': 'text/plain' }, body: new Blob([JSON.stringify(obj)], { type: 'text/plain' }) });
    return r.json();
  }
  async function ensureFolder(parent, name) {
    const full = parent ? parent + '/' + name : name;
    const ex = await g(itemUrl(full));
    if (ex) return ex.json();
    const url = parent ? itemUrl(parent) + ':/children' : `${driveBase}/root/children`;
    const r = await g(url, { method: 'POST', body: { name, folder: {}, '@microsoft.graph.conflictBehavior': 'replace' } });
    return r.json();
  }

  // ---------- evidencias (cualquier formato; >4 MB con sesión de carga)
  const safeName = n => n.replace(/[\\/:*?"<>|#%]+/g, '_').slice(-120);
  async function uploadFile(path, file) {
    if (file.size <= 4 * 1048576) {
      const r = await g(itemUrl(path) + ':/content', { method: 'PUT', headers: { 'Content-Type': file.type || 'application/octet-stream' }, body: file });
      return r.json();
    }
    const s = await (await g(itemUrl(path) + ':/createUploadSession', { method: 'POST', body: { item: { '@microsoft.graph.conflictBehavior': 'rename' } } })).json();
    const CH = 10 * 327680; let pos = 0, last = null;
    while (pos < file.size) {
      const end = Math.min(pos + CH, file.size);
      const r = await fetch(s.uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${pos}-${end - 1}/${file.size}` }, body: file.slice(pos, end) });
      if (!r.ok && r.status !== 202) throw new Error('No se pudo subir el archivo (' + r.status + ')');
      last = r; pos = end;
    }
    return last.json();
  }
  const assetsAPI = {
    async upload(file, opt = {}) {
      const cid = S.role === 'admin' ? S.cid : S.me;
      const item = await uploadFile(`Clientes/${cid}/evidencias/${opt.qid || 'general'}/${Date.now().toString(36)}-${safeName(file.name)}`, file);
      return { id: item.id, sizeBytes: item.size, webUrl: item.webUrl };
    },
    async delete(id) { await g(`${driveBase}/items/${id}`, { method: 'DELETE' }); return { deleted: true }; },
  };
  const downloadsAPI = {
    async save({ filename, data }) {
      const url = URL.createObjectURL(new Blob([data], { type: /\.csv$/i.test(filename) ? 'text/csv;charset=utf-8' : 'text/html;charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    },
  };

  // ---------- pantallas propias (inicio de sesión, error)
  function screen(html) { document.getElementById('app').innerHTML = `<div class="login"><img src="${LOGO_FULL}" alt="Aztlan" class="login-logo"><div class="login-card">${html}</div><p class="muted small">Plataforma ESG · Metodología propietaria Aztlan</p></div>`; }
  function loginScreen(note) {
    screen(`<h1>Plataforma ESG Aztlan</h1><p>Inicia sesión con tu cuenta de Microsoft o con el correo con el que Aztlan te invitó. Si tu correo no es de Microsoft, recibirás un código de acceso.</p>
      ${note ? `<div class="note">${esc(note)}</div>` : ''}<button class="btn big" id="loginBtn">Iniciar sesión</button>`);
    document.getElementById('loginBtn').onclick = () => msalApp.loginRedirect({ scopes: SCOPES, prompt: 'select_account' });
  }
  function errorScreen(title, detail) {
    screen(`<h1>${esc(title)}</h1><p>${detail}</p><div class="row"><button class="btn" onclick="location.reload()">Reintentar</button>${msalApp ? '<button class="btn ghost" id="outBtn">Cambiar de cuenta</button>' : ''}</div>`);
    const o = document.getElementById('outBtn'); if (o) o.onclick = logout;
  }
  function logout() { if (msalApp) msalApp.logoutRedirect({ account, postLogoutRedirectUri: appUrl() }); }

  // ---------- arranque
  async function resolveDrive() {
    if (CFG.DRIVE_ID) return CFG.DRIVE_ID;
    const site = await g(`/sites/${CFG.SP_HOST}:${CFG.SP_SITE_PATH}`);
    if (!site) throw Object.assign(new Error('No se encontró el sitio de SharePoint ' + CFG.SP_HOST + CFG.SP_SITE_PATH), { status: 404 });
    const s = await site.json();
    const d = await (await g(`/sites/${s.id}/drive`)).json();
    return d.id;
  }
  async function isAdmin() {
    try { const r = await g(`${driveBase}/root/children?$select=name&$top=1`); return !!r; }
    catch (e) { if (e.status === 403 || e.status === 401) return false; throw e; }
  }
  async function boot() {
    const qs = new URLSearchParams(location.search);
    if (qs.get('e')) { try { localStorage.setItem('aztlan-empresa', qs.get('e')); } catch (e) {} }
    if (!CFG.CLIENT_ID || !CFG.TENANT_ID || !(CFG.DRIVE_ID || (CFG.SP_HOST && CFG.SP_SITE_PATH))) {
      startDemo('Falta completar config.js (TENANT_ID, CLIENT_ID y el sitio de SharePoint). Mientras tanto la plataforma funciona en modo demostración.');
      return;
    }
    render();
    try {
      if (!window.__TEST_TOKEN) {
        if (!window.msal) { errorScreen('No se cargó el inicio de sesión de Microsoft', 'Falta el archivo <code>msal-browser.min.js</code> en el repositorio.'); return; }
        msalApp = new msal.PublicClientApplication({ auth: { clientId: CFG.CLIENT_ID, authority: 'https://login.microsoftonline.com/' + CFG.TENANT_ID, redirectUri: appUrl() }, cache: { cacheLocation: 'localStorage' } });
        await msalApp.initialize();
        const res = await msalApp.handleRedirectPromise();
        account = res?.account || msalApp.getActiveAccount() || msalApp.getAllAccounts()[0];
        if (!account) { loginScreen(); return; }
        msalApp.setActiveAccount(account);
        if (location.search) history.replaceState(null, '', appUrl());
      }
      driveId = await resolveDrive(); driveBase = `/drives/${driveId}`;
      Object.assign(S, { backend: 'sp', mode: 'live', anyFile: true, assets: assetsAPI, downloads: downloadsAPI, userName: account?.name || account?.username || '' });
      if (await isAdmin()) await startAdmin();
      else await startClient();
      clearInterval(pollTimer);
      pollTimer = setInterval(() => { if (document.visibilityState === 'visible') refresh().catch(() => {}); }, 45000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh().catch(() => {}); });
    } catch (e) {
      if (e.handled) return;
      console.error(e);
      errorScreen('No se pudo conectar con SharePoint', `Revisa la configuración o tus permisos. Detalle técnico: <code>${esc(e.message || String(e))}</code>`);
    }
  }
  async function startAdmin() {
    S.role = 'admin'; S.view = 'cartera'; S.cid = null;
    await Promise.all([ensureFolder('', 'Clientes'), ensureFolder('', 'Revisiones'), ensureFolder('', 'Publico')]);
    await loadAdmin(); render();
  }
  async function loadAdmin() {
    const r = await g(`${itemUrl('Clientes')}:/children?$select=id,name,folder&$top=999`);
    const items = r ? (await r.json()).value.filter(x => x.folder) : [];
    const comps = {}, revs = {};
    await Promise.all(items.map(async it => {
      const [c, v] = await Promise.all([getJSON(`Clientes/${it.name}/empresa.json`), getJSON(`Revisiones/${it.name}/revision.json`)]);
      comps[it.name] = c || blankCompany(); revs[it.name] = v || {};
      comps[it.name]._folderId = it.id;
    }));
    if ((S.reviewDirty) && S.cid && S.reviews[S.cid]) revs[S.cid] = S.reviews[S.cid];
    S.companies = comps; S.reviews = revs;
    S.bench = await getJSON('Publico/benchmarks.json');
    publishBench();
  }
  async function startClient() {
    let id = null; try { id = localStorage.getItem('aztlan-empresa'); } catch (e) {}
    if (!id) { errorScreen('Abre el enlace de tu invitación', 'Para entrar a tu evaluación usa el enlace que Aztlan te envió por correo (termina en <code>?e=…</code>). Si no lo tienes, pídeselo a Aztlan.'); throw Object.assign(new Error('sin-empresa'), { handled: true }); }
    S.role = 'client'; S.me = id; S.cid = id; S.view = 'inicio';
    const c = await getJSON(`Clientes/${id}/empresa.json`);
    if (!c) { errorScreen('No tienes acceso a esta evaluación', `Tu cuenta (${esc(account?.username || '')}) no tiene permiso sobre la empresa <b>${esc(id)}</b>. Verifica que iniciaste sesión con el correo al que llegó la invitación, o pide a Aztlan que te vuelva a invitar.`); throw Object.assign(new Error('sin-acceso'), { handled: true }); }
    S.data = c; await loadClientExtras(); render();
  }
  async function loadClientExtras() {
    const [v, b] = await Promise.all([getJSON(`Revisiones/${S.me}/revision.json`), getJSON('Publico/benchmarks.json')]);
    S.review = v || {}; S.bench = b;
  }
  async function refresh() {
    if (S.backend !== 'sp') return;
    if (S.role === 'admin') { await loadAdmin(); maybeRender(); }
    else {
      const c = await getJSON(`Clientes/${S.me}/empresa.json`);
      if (c && !S.dirty && !S.saving) S.data = c;
      await loadClientExtras(); maybeRender();
    }
  }

  // ---------- escritura
  async function saveCompany(id, d) { delete d._folderId; await putJSON(`Clientes/${id}/empresa.json`, d); }
  async function saveReview(id, rv) { await putJSON(`Revisiones/${id}/revision.json`, rv); }
  async function saveBench(b) { await putJSON('Publico/benchmarks.json', b); }

  // ---------- invitar clientes
  const slug = s => (s || 'empresa').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'empresa';
  async function shareItem(itemId, emails, role, sendInvitation, message) {
    await g(`${driveBase}/items/${itemId}/invite`, { method: 'POST', body: { recipients: emails.map(email => ({ email })), requireSignIn: true, sendInvitation, roles: [role], ...(message ? { message } : {}) } });
  }
  async function invite(name, sector, emails, existingId) {
    const id = existingId || (slug(name) + '-' + Math.random().toString(36).slice(2, 6));
    const folder = await ensureFolder('Clientes', id);
    await ensureFolder(`Clientes/${id}`, 'evidencias');
    const rev = await ensureFolder('Revisiones', id);
    const pub = await ensureFolder('', 'Publico');
    if (!existingId) {
      const c = blankCompany(); c.profile = { name, sector }; await putJSON(`Clientes/${id}/empresa.json`, c);
      await putJSON(`Revisiones/${id}/revision.json`, { status: '', log: [], createdAt: today() });
    }
    const link = appUrl() + '?e=' + encodeURIComponent(id);
    const msg = `Aztlan te da acceso a la Plataforma ESG para la evaluación de ${name}. Entra aquí con este mismo correo: ${link}  (Este correo de SharePoint también te da acceso a la carpeta donde se guardan tus evidencias.)`;
    await shareItem(folder.id, emails, 'write', true, msg.slice(0, 1900));
    await shareItem(rev.id, emails, 'read', false);
    await shareItem(pub.id, emails, 'read', false);
    return { id, link };
  }
  function inviteCard() {
    const st = S.inviteState || {};
    return `<div class="card soft"><div class="ch"><h3>Invitar cliente</h3><span class="muted small">Crea su carpeta en SharePoint y le envía el acceso por correo</span></div>
      <form class="cform" data-a="spinvite">
        <input name="name" placeholder="Razón social" class="grow" required>
        <select name="sector">${Object.keys(SECTORS).map(s => `<option>${s}</option>`).join('')}</select>
        <input name="emails" placeholder="correo@cliente.com, otro@cliente.com" class="grow" required>
        <button class="btn" ${st.busy ? 'disabled' : ''}>${st.busy ? 'Invitando…' : 'Invitar'}</button>
      </form>
      ${st.err ? `<div class="note">${esc(st.err)}</div>` : ''}
      ${st.link ? `<div class="linkrow"><span class="okc">✓ Invitación enviada.</span><code>${esc(st.link)}</code><button class="btn ghost sm" data-a="copytext" data-t="${esc(st.link)}">Copiar enlace</button></div>` : ''}
      <details class="guide"><summary>${bulbIcon()}<span>Dar acceso a otra persona de una empresa ya invitada</span></summary><div class="g-body" style="grid-template-columns:1fr">
        <form class="cform" data-a="spreinvite"><select name="id">${Object.entries(S.companies).map(([k, d]) => `<option value="${esc(k)}">${esc(d.profile?.name || k)}</option>`).join('')}</select><input name="emails" placeholder="correo@cliente.com" class="grow" required><button class="btn sm">Dar acceso</button></form>
        <p class="muted small">Todas las personas con acceso a una empresa ven y editan la misma evaluación.</p></div></details>
      <p class="muted small">Sitio: ${esc((CFG.SP_HOST || '') + (CFG.SP_SITE_PATH || ''))} · ${CFG.DRIVE_ID ? 'DRIVE_ID configurado' : `<b>Recomendado:</b> copia este DRIVE_ID en config.js para que los clientes se conecten directo: <code>${esc(driveId)}</code> <button class="link" data-a="copytext" data-t="${esc(driveId)}">Copiar</button>`} · Sesión: ${esc(S.userName)} · <button class="link" data-a="logout">Cerrar sesión</button></p>
    </div>`;
  }
  document.addEventListener('submit', async e => {
    const f = e.target.closest('form[data-a="spinvite"],form[data-a="spreinvite"]'); if (!f) return;
    e.preventDefault(); e.stopImmediatePropagation();
    const fd = Object.fromEntries(new FormData(f).entries());
    const emails = (fd.emails || '').split(/[,;\s]+/).map(x => x.trim()).filter(x => /.+@.+\..+/.test(x));
    if (!emails.length) { S.inviteState = { err: 'Escribe al menos un correo válido.' }; render(); return; }
    S.inviteState = { busy: true }; render();
    try {
      const r = f.dataset.a === 'spinvite' ? await invite(fd.name.trim(), fd.sector, emails) : await invite(S.companies[fd.id]?.profile?.name || fd.id, null, emails, fd.id);
      S.inviteState = { link: r.link }; await loadAdmin();
    } catch (err) {
      S.inviteState = { err: 'No se pudo invitar: ' + (err.status === 403 ? 'tu cuenta o el sitio no permiten compartir con externos (revisa la configuración de uso compartido externo del sitio).' : err.message) };
    }
    render();
  }, true);
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a="logout"],[data-a="copytext"]'); if (!b) return;
    if (b.dataset.a === 'logout') logout();
    else { navigator.clipboard?.writeText(b.dataset.t).then(() => { const t = b.textContent; b.textContent = '¡Copiado!'; setTimeout(() => { b.textContent = t; }, 1500); }).catch(() => {}); }
  });

  return { boot, saveCompany, saveReview, saveBench, inviteCard, logout, refresh };
})();

SP.boot();
